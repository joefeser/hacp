agentControl:
  requiredVersion: ">=0.2.0"
  channel: stable
  allowPrerelease: false
  requiredCapabilities:
    - reviewQuorum
    - requiredReviewerBatching
    - quietJson
    - freshnessGate
    - exceptionHandoff

lane:
  id: hacp-pr-review-loop
  version: 0.1.0
  status: active
  description: >
    Repo-local ACK lane for HACP protocol, docs, schemas, examples, and
    governance changes. Use dev for agent PR loops; keep main promotion
    human-mediated.

prLoopPacket:
  costProfile: small_team
  policyProfile: default
  reviewFreshnessPolicy:
    maxFreshReviewFixCycles: 2
    riskyFileGlobs:
      - .github/workflows/**
      - .agent-control/**
      - package.json
      - package-lock.json
      - scripts/**
      - schemas/**
      - profiles/**
      - decision-matrix-base-v0.1.yaml
      - rfcs/**
  reviewQuorum:
    enabled: true
    groups:
      trustedCodeReview:
        bots:
          - codex
          - qodo
        minimumReturned: 1
        preferAllReturned: false
        waitForAllTimeoutSeconds: 600
        noneReturnedStopReason: REQUIRED_REVIEW_QUORUM_NOT_MET
    pathRiskTiers:
      docsOnly:
        include:
          - README.md
          - adoption-primer.md
          - quickstart.md
          - review-packet.md
          - safe-stop-reliability-boundary.md
          - stop-response-decision-guide.md
          - docs/**
          - site/**
          - examples/**
          - fixtures/**
          - open-playbook-template-pack/**
        minimumReturned: 1
        preferAllReturned: false
        waitForAllTimeoutSeconds: 0
      protocolOrConfig:
        include:
          - .agent-control/**
          - rfcs/**
          - schemas/**
          - profiles/**
          - scripts/**
          - package.json
          - package-lock.json
          - decision-matrix-base-v0.1.yaml
        minimumReturned: 2
        preferAllReturned: true
        waitForAllTimeoutSeconds: 600
      mixed:
        useTier: protocolOrConfig
      unknown:
        useTier: protocolOrConfig
  postRequiredReviewMutationPolicy:
    optionalReviewerPatches: owner_decision
  pushPolicy:
    mode: batch_until_review_settles
    localFixesPresent: false
    validationEvidence: []
    findingUrls: []
    waitTimeoutSeconds: 600
  bots:
    codex:
      requirement: required
      waitUntilReturnedBeforeProcessing: true
      waitTimeoutSeconds: 600
      acknowledgedWaitTimeoutSeconds: 600
      requestAllowed: policy
      requestRetryCeiling: 2
      retryCooldownSeconds: 120
    qodo:
      requirement: required
      waitUntilReturnedBeforeProcessing: true
      waitTimeoutSeconds: 600
      requestAllowed: explicit_only
      requestRetryCeiling: 0
      retryCooldownSeconds: 0
    gemini:
      requirement: optional
      waitUntilReturnedBeforeProcessing: false
    sourcery:
      requirement: optional
      waitUntilReturnedBeforeProcessing: false
  branchPolicy:
    overnightAllowedMergeTargets:
      - dev
      - integration/**
    overnightForbiddenMergeTargets:
      - main
      - master
      - release/**
    ownerOverrideEligibleTargets:
      - dev
      - integration/**
    ownerOverrideDeniedTargets:
      - main
      - master
      - release/**
    mainPromotionRequiresSeparatePr: true
    mainPromotionOwnerOnly: true
    mergeMethod: merge_commit

operationalNotes:
  laneConfigReadback: >
    agent-control pr-loop loads this file from the repo-local worktree by
    default and reports evidence.configSource.laneConfig.status/path.
  requiredReviewerBatching: >
    Codex and Qodo are required for this lane. Do not process partial findings
    until the configured reviewer set has returned or ACK emits a typed bounded
    handoff.
  reviewQuorumBoundary: >
    Docs-only dev work may use the trusted reviewer quorum. Protocol, schema,
    profile, script, package, and ACK config changes require stricter reviewer
    coverage. Returned findings, unresolved review threads, failed checks, and
    unsafe merge state still block.
  qodoLifecycle: >
    ACK must not post @qodo-code-review review. Missing or delayed Qodo state is
    handled by bounded wait, quorum, residual-risk, or human-decision readback.
  botRetagBoundary: >
    Do not manually retag Codex, Qodo, Gemini, Sourcery, or other review bots.
  mainPromotion: >
    main is human-mediated. Clean main promotion owner decisions are not normal
    overnight auto-merge, and stale or delayed reviewer evidence should be
    reported plainly.
  mergeMethod: >
    Use merge commits. Do not recommend squash merges unless a future
    owner-approved packet grants that authority.

rules:
  - Use the repo-local lane YAML.
  - Run the full ACK loop after opening a PR, not status-only.
  - Patch only when nextAction is patch_actionable_findings.
  - Read patchBriefAbsolutePath before fetching GitHub review bodies manually.
  - Let ACK handle stale bot summary freshness waiting.
  - Report the final ACK decision, stopReason, nextAction, head SHA, and merge recommendation.
